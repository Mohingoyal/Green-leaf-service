<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GREENLEAF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <link href="style/style.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
    <script>
$(document).ready(function(){
    //alert("jo");to check whether jquery activated or not 
    $("#ShowHidePwd1").mousedown(function(){
        $(this).removeClass("fa-eye-slash").addClass("fa-eye");
        $("#txtPwd").prop("type","text");
    })
     $("#ShowHidePwd1").mouseup(function(){
        $(this).removeClass("fa-eye").addClass("fa-eye-slash");
        $("#txtPwd").prop("type","password");
    })
    //==================
      $("#ShowHidePwd2").mousedown(function(){
        $(this).removeClass("fa-eye-slash").addClass("fa-eye");
        $("#txtnewPwd").prop("type","text");
    })
     $("#ShowHidePwd2").mouseup(function(){
        $(this).removeClass("fa-eye").addClass("fa-eye-slash");
        $("#txtnewPwd").prop("type","password");
    })
    //====================
    $("#txtnewPwd").change(function(){
        let regex=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/
        let pwd=$(this).val();
        if(regex.test(pwd)==false)
    {
         $(this).css("border-color", "red")
                    $("#msgPwd").html("Password should be At least 8 characters, one uppercase, one lowercase, one digit, and one special character").addClass("notok").removeClass("ok");
    }
    else{
        $(this).css("border-color","green");
        $("#msgPwd").html("Valid").addClass("ok").removeClass("notok");

    }
    })

})
    </script>
    <script>
        function setemail() {
            document.getElementById("txtEmail").value = localStorage.getItem("activeuser");
        }
    </script>
    <script>
        function dologout() {
            localStorage.removeItem("activeuser");
            location.href = "/"
        }
    </script>
    <script>
        let myModule = angular.module("modulekuch", []);
        let myController = myModule.controller("controllerkuch", function ($scope, $http) {
            $scope.txtEmail3 = "";
            $scope.colorvar = ""
            $scope.txtPwd3 = "";
            $scope.txtNewPwd = "";
            $scope.updatepwd = "";
            $scope.doupdate = function () {
                let url = "/do-update-needy?email=" + $scope.txtEmail3 + "&pwd=" + $scope.txtPwd3 + "&newpwd=" + $scope.txtNewPwd;
                $http.get(url).then(function (resp) {
                    //alert("hi");
                    if (resp.data == "1") {
                        $scope.updatepwd = "Password has been upgraded successfully!"
                        $scope.colorvar = "green"
                    }
                    else if (resp.data == "0") {
                        $scope.updatepwd = "The input credentials are wrong. "
                        $scope.colorvar = "red"
                    }
                    //alert($scope.updatepwd);
                }, function (err) { alert(err); })

            }
            //======================
        })
    </script>
</head>

<body ng-app="modulekuch" ng-controller="controllerkuch" style="background-color: blanchedalmond;" onload="setemail();">
    <nav class="navbar p-0 mb-3" style="background-color: beige;">
        <div class="container-fluid ">
            <a class="navbar-brand" href="#">
                <img src="pics/pngtree-green-leaf-logo-organic-life-design-vector-png-image_43723186.png" alt="Logo"
                    width="100" height="80">
                <span style="font-family: cursive;font-size: x-large;"><b>Green Leaf</b></span>

            </a>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button class="btn btn-danger me-md-2" type="button" onclick="dologout();">logout</button>

            </div>

        </div>
    </nav>
    <form><!--this is for mrethod=get-->
        <div class="container mb-3 p-3" style="border-radius: 12px;">
            <div class="row row-cols-1 row-cols-md-3 g-4">
                <div class="col">
                    <div class="card border-primary text-center h-100">
                        <!-- <img src="pics/307ce493-b254-4b2d-8ba4-d12c080d6651.jpg" class="card-img-top" alt="..."
                            height="350"> -->
                        <div class="pt-4">
                            <i class="fa-solid fa-image-portrait" style="font-size: 250px;"></i>
                        </div>
                        <div class="card-body">
                            <a href="/needy-profile-btn" class="btn btn-outline-primary">View Profile</a>
                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="card border-success h-100 text-center">
                        <!-- <img src="pics/2108.q705.020.S.m005.c10.healthcare medications.jpg" class="card-img-top"
                            alt="..." height="350"> -->
                        <div class="pt-4">

                            <i class="fa-solid fa-building-ngo" style="font-size: 230px;"></i>
                        </div>
                        <div class="card-body">
                            <a href="/ngo-finder-btn" class="btn btn-outline-success mt-3">Find NGOs Near Me</a>
                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="card border-danger h-100 text-center">
                        <!-- <img src="pics/27253.jpg" class="card-img-top" alt="..." height="350"> -->
                        <div class="pt-4">
                            <i class="fa-solid fa-crutch" style="font-size: 250px;"></i>
                        </div>
                        <div class="card-body">
                            <a href="/get-equip-btn" class="btn btn-outline-danger">Get Essential Medical Supplies</a>
                        </div>
                    </div>
                </div>

                <div class="col"></div>
                <div class="col">
                    <div class="card border-danger h-100 text-center">
                        <!-- <img src="pics/d184c32b-9410-4627-881c-e3db80456315.jpg" class="card-img-top" alt="..."
                            height="350"> -->
                        <div class="pt-4">
                            <i class="fa-solid fa-gear" style="font-size: 250px;"></i>
                        </div>
                        <div class="card-body">
                            <!-- <a href="#" class="btn btn-outline-danger">Settings</a> -->
                            <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal"
                                data-bs-target="#SettingsModal">
                                Settings
                            </button>
                        </div>
                    </div>
                </div>


            </div>
        </div>
    </form>
    <!--//===================================================-->
    <div class="modal fade" id="SettingsModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Settings Modal</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div class="input-group mb-3">
                        <span class="input-group-text" id="basic-addon1">Emailid</span>
                        <input type="text" class="form-control" aria-label="Username" name="email" id="txtEmail"
                            readonly aria-describedby="basic-addon1" ng-model="txtEmail3" required>
                        <!-- <span ng-show="myform.email.$error.pattern" ng-hide="myform.email.$error.pattern" style="color: red;">Please enter a valid email address</span> -->
                    </div>
                    <div class="row g-3">
                        <div class="col-md-10">
                            <div class="input-group mb-3">
                                <span class="input-group-text" id="basic-addon1">Existing Password</span>
                                <input type="password" class="form-control " id="txtPwd" aria-label="Username"
                                    aria-describedby="basic-addon1" ng-model="txtPwd3" required>
                            </div>
                        </div>
                        <div class="col-md-2 ">
                            <i class="fa-solid fa-eye-slash" id="ShowHidePwd1" style="font-size: xx-large;"></i>
                        </div>
                    </div>
<div>
                        <div class="row g-3">
                        <div class="col-md-10">
                            <div class="input-group mb-3">
                                <span class="input-group-text" id="basic-addon1">New Password</span>
                                <input type="password" class="form-control" id="txtnewPwd" aria-label="Username"
                                    aria-describedby="basic-addon1" ng-model="txtNewPwd" required>
                            </div>
                        </div>
                        <div class="col-md-2 ">
                            <i class="fa-solid fa-eye-slash" style="font-size: xx-large;" id="ShowHidePwd2"></i>
                        </div>
                    </div>
                <div class="row g-3">
                    <span id="msgPwd"></span>
                </div>
                </div>

                    <div class="modal-footer justify-content-center">
                        <div class="row">
                            <button type="button" class="btn btn-outline-primary" ng-click="doupdate();">Update
                                Password</button>
                        </div>
                        <!-- <span ng-style="{'color':colorvar}" >{{updatepwd}}</span> -->
                        <div class="text-center">
                            <span ng-style="{'color':colorvar}">{{updatepwd}}</span>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
