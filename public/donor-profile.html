<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GREENLEAF</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script>
    function setemail(){
      document.getElementById("txtEmail").value=localStorage.getItem("activeuser");
    }
  </script>
  <script>
    function doShowprev(fileCtrl, prev) {
      let file = fileCtrl.files[0];
      if (file) {
        prev.src = URL.createObjectURL(file);
      }

    }
    $(document).ready(function () {
       $("#submit-btn").click(function(e){
        if($("#aadharpic").val()=="")
       {
        //alert("incorrect");
        $("#aadharmsg").html("This is a required field").css("color","red");
        e.preventDefault();
       }
       else{$("#aadharmsg").html("")

       }
        if($("#profilepic").val()=="")
       {
        //alert("incorrect");
        $("#profilemsg").html("This is a required field").css("color","red");
        e.preventDefault();
       }
       })
      //==============================
      $("#btnprodata").click(function () {
        let obj = {
          url: "/get-data",
          data: {
            emailid: $("#txtEmail").val()
          }
        }
        $.ajax(obj).then(function (jsonAry) {

          $("#txtName").val(jsonAry[0].dname);
          $("#txtMobile").val(jsonAry[0].mobile);
          $("#txtAddress").val(jsonAry[0].address);
          $("#inputCity").val(jsonAry[0].city);
          //=======================
          // alert(jsonAry[0].acardpath);
          // alert(jsonAry[0].picpath);
          $("#hdn1").val(jsonAry[0].acardpath);
          $("#hdn2").val(jsonAry[0].picpath);
          //alert($("#hdn1").val());
          //================================
          $("#prevaadhar").prop("src", jsonAry[0].acardpath);
          $("#prevprofile").prop("src", jsonAry[0].picpath)
           


        }).fail(function (err) {
          alert(err);
        })
      })
    })
  </script>
</head>

<body onload="setemail();">
   <nav class="navbar p-0 mb-5" style="background-color: beige;">
        <div class="container-fluid ">
            <a class="navbar-brand" href="#">
                <img src="pics/pngtree-green-leaf-logo-organic-life-design-vector-png-image_43723186.png" alt="Logo"
                    width="100" height="80">
                <span style="font-family: cursive;font-size: x-large;"><b>Green Leaf</b></span>
            </a>
        </div>
    </nav>
  <div class="container  p-5 " style="background-color: beige;border-radius: 20px;"><!--s is for left spacing-->
    <div class="row">
      <form class="row   " action="/donor-profile" method="post" enctype="multipart/form-data">
        <input type="hidden" id="hdn1" name="hdn1">
        <input type="hidden" id="hdn2" name="hdn2">
        <!--we have to send image also thats why post-->

        <div class="col-md-7">
          <label for="inputEmail4" class="form-label">Email</label>
          <input type="email" class="form-control " id="txtEmail" name="txtEmail" readonly style="float: left;" required>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <input type="button" class="btn btn-success w-100" value="Get Profile Data" id="btnprodata">


        </div>
        <div class="row ">
          <div class="col-md-6">
            <label for="inputEmail4" class="form-label">Name</label>
            <input type="text" class="form-control" id="txtName" name="txtName" required>
          </div>
          <div class="col-md-5">
            <label for="inputPassword4" class="form-label">Mobile Number</label>
            <input type="text" required class="form-control" id="txtMobile" name="txtMobile" required>
          </div>
        </div>
        <div class="col-md-8">
          <label for="inputAddress" class="form-label">Address</label>
          <input type="text" class="form-control" id="txtAddress" name="txtAddress" required>
        </div>

        <div class="col-md-4">
          <label for="inputCity" class="form-label">City</label>
          <input type="text" class="form-control" id="inputCity" name="txtCity" required>
        </div>
        <div class="row g-4 justify-content-center">
          <div class="card " style="width: 18rem;margin-right: 5px;">
            <input type="file" name="aadharpic"  onchange="doShowprev(this,prevaadhar)" id="aadharpic">
            <img src="" class="card-img-top" alt="" id="prevaadhar" width="100" height="150">
            <!-- <iframe src="" id="prevaadharpdf"></iframe> -->
            <div class="card-body">
              <div class="p-3 mb-2 bg-success text-white">Upload Aadhar Card Picture</div>
              <span id="aadharmsg"></span>
            </div>
          </div>
          <div class="card " style="width: 18rem;margin-left: 5px;">
            <input type="file" name="profilepic" onchange="doShowprev(this,prevprofile)" id="profilepic">
            <img src="" class="card-img-top"  alt="" id="prevprofile" width="100" height="150">
            <!-- <iframe src="" id="prevprofilepdf"></iframe> -->

            <div class="card-body">
              <div class="p-3 mb-2 bg-success text-white">Upload Profile Picture</div>
              <span id="profilemsg"></span>
            </div>
          </div>
        </div>
        <div class="d-grid gap-4 d-md-flex justify-content-md-center mt-4">
          <input class="btn btn-danger me-md-2 " type="submit" value="Save My Profile" id="submit-btn">
          <input class="btn btn-danger" type="submit" formaction="modify-donor-profile" value="Modify My Profile">
        </div>



      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
