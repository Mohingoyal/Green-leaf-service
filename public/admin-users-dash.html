<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GREENLEAF</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
  <script>
    let myModule = angular.module("modulekuch", []);
    let myController = myModule.controller("controllerkuch", function ($scope, $http) {
      $scope.dodelete = function (emailid) {
        let url = "/delete-user?emailid=" + emailid;
        $http.get(url).then(function (resp) {
          //alert(resp.data);
          $scope.doShowAll();
        }, function (err) {
          alert(err);
        })

      }
      $scope.doShowAll = function () {
        let url = "/fetch-data";
        $http.get(url).then(function (resp) {
          $scope.jsonAry = resp.data;

          //alert(JSON.stringify(resp.data))
        }, function (err) {
          alert(err);
        })

      }
      $scope.doblock = function (emailid) {

        let url = "/do-block?emailkey=" + emailid;
        $http.get(url).then(function (resp) {
          alert("blocked");
          //    $scope.status="Blocked"
          $scope.doShowAll();

        }, function (err) { alert(err); });

      }
      $scope.doresume = function (email) {
        let url = "/do-resume?emailkey=" + email;
        $http.get(url).then(function (resp) {
          alert("resumed");
          //  $scope.status="Active"
          $scope.doShowAll();

        }, function (err) {
          alert(err);
        })

      }
    })
  </script>
</head>

<body ng-app="modulekuch" ng-controller="controllerkuch" ng-init="doShowAll();">
  <nav class="navbar bg-dark border-bottom border-body mb-3" data-bs-theme="dark">
    <div class="container-fluid justify-content-center">
      <span class="navbar-text fw-bold text-light">
        ADMIN-PORTAL
      </span>
    </div>
  </nav>
  <div class="container">
    <table class="table table-dark table-hover align-middle">
      <tr>
        <th>
          Sr.No.
        </th>
        <th>Emailid</th>
        <th>Password</th>
        <th>User-type</th>
        <th>Date Of Submission</th>
        <th>Status</th>
        <th>Delete</th>
      </tr>
      <tr ng-repeat="obj in jsonAry">
        <td>{{$index+1}}</td>
        <td>{{obj.emailid}}</td>
        <td>{{obj.pwd}}</td>
        <td>{{obj.utype}}</td>
        <td>
          {{obj.dos}}
        </td>
        <td>
          <button type="button" class="btn btn-danger" ng-show="obj.active=='1'"
            ng-click="doblock(obj.emailid);">Block</button>
          <button type="button" class="btn btn-success" ng-show="obj.active=='0'"
            ng-click="doresume(obj.emailid);">Activate</button>
        </td>
        <td>
          <button type="button" class="btn btn-danger" ng-click="dodelete(obj.emailid);">Delete</button>
        </td>

        <!-- <td>
    <input type="text" class="btn btn-info" >
</td> -->
        <!-- <td>
    <button type="button" class="btn btn-success">Active</button>
</td>
<td>
     <input type="button" class="btn btn-success" value="">
</td> -->
      </tr>
    </table>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
