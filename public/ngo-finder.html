<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GREENLEAF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
   
     <script>
        let myModule=angular.module("modulekuch",[]);
        let myController=myModule.controller("controllerkuch",function($scope,$http){
$scope.dofetchcities=function(){
    let url="/fetch-cities";
    $http.get(url).then(function(resp){
        $scope.jsonArraycity=resp.data;
    },function(err){alert(err);})
}
$scope.findngo=function(city){
    $scope.city=city;
    let url="/fetch-ngos-city?city="+$scope.city;
    $http.get(url).then(function(resp){
$scope.ngoarray=resp.data
    },function(err){alert(err);})

}
        })
     </script>
  </head>
  <body ng-app="modulekuch" ng-controller="controllerkuch" ng-init="dofetchcities();">
    <nav class="navbar p-0 mb-5" style="background-color: beige;">
        <div class="container-fluid ">
            <a class="navbar-brand" href="#">
                <img src="pics/pngtree-green-leaf-logo-organic-life-design-vector-png-image_43723186.png" alt="Logo"
                    width="100" height="80">
                <span style="font-family: cursive;font-size: x-large;"><b>Green Leaf</b></span>

            </a>
        </div>
    </nav>
    <div class="container p-3" style="background-color: blanchedalmond;border-radius: 12px;">
        <div class="row g-3 justify-content-center mb-3">
            <div class="col-auto">
            <label for="exampleDataList" class="col-form-label">Select City</label>
        </div>
            <div class="col-auto d-flex align-items-end col-md-4">
<input class="form-control" list="datalistOptions" id="exampleDataList" ng-model="SelCity" placeholder="Type to search...">
<datalist id="datalistOptions">
  <option ng-repeat="obj in jsonArraycity" value="{{obj.city}}"></option>
</datalist>
</div>
<div class="col-auto">
    <input type="button" class="col-form-label btn btn-danger" ng-click="findngo(SelCity);" value="Find NGOs">
</div>
        </div>
<table class="table table-hover table-warning text-center">
 <tr>   
<th>Sr. No.</th>
<th>NGO Name</th>
<th>Address</th>
<th>Website</th>
<th>Contact Number</th>
<th>NGO Profile</th></tr>
<tr ng-repeat="obj in ngoarray">
    <td>{{$index+1}}</td>
        <td>{{obj.ngo}}</td>
            <td>{{obj.regoffice}}</td>
                <td>
                    <a href="{{obj.website}}">Click to view the website </a>
                </td>
                <td>{{obj.contactno}}</td>
                    <td>{{obj.ngoworks}}</td>
</tr>
</table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
