<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GREENLEAF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <script>
        let myModule=angular.module("modulekuch",[]);
        let myController=myModule.controller("controllerkuch",function($scope,$http){
            $scope.doShowAll=function(){
                let url="/fetch-data-donors";
                $http.get(url).then(function(resp){
                    $scope.jsonAry=resp.data;
                    
                    //alert(JSON.stringify(resp.data))
                },function(err){
                    alert(err);
                })

            }
        })
    </script>
   
  </head>
  <body ng-app="modulekuch" ng-controller="controllerkuch">
    <nav class="navbar bg-dark border-bottom border-body mb-3" data-bs-theme="dark">
  <div class="container-fluid justify-content-center">
     <span class="navbar-text fw-bold text-light">
      ADMIN-DONORS-PORTAL
    </span>
  </div>
</nav>
<div class="container mb-3">
    <div class="row justify-content-center">
        <button type="button" class="btn btn-info col-md-2 text-dark" ng-click="doShowAll();">Fetch All Donors</button>
    </div>
</div>
<div class="container">
<table class="table table-dark table-hover align-middle">
<tr>
    <th>Sr.No.</th><th>Emailid</th><th>Name</th><th>Mobile</th><th>Address</th><th>City</th><th>Aadhar card</th><th>Profile pic</th>
</tr>
<tr ng-repeat="obj in jsonAry">

    <td>{{$index+1}}</td>
    <td>{{obj.emailid}}</td>
    <td>{{obj.dname}}</td>
    <td>{{obj.mobile}}</td>
    <td>{{obj.address}}</td>
    <td>{{obj.city}}</td>
    <td>
        <img src={{obj.acardpath}} width="80" height="80" alt="">
    </td>
    <td>
        <img src={{obj.picpath}}  width="80" height="80" alt="">
    </td>
</tr>
</table>
</div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
